name: Cập nhật bảng thưởng Tết Hà Nội

on:
  push:
    paths:
      - '.github/workflows/pages.yml'
      - 'data/sources.json'
      - 'data/snapshot.json'
      - 'scripts/**'
      - 'site/**'
      - 'requirements.txt'
  schedule:
    - cron: '59 16 * * *' # Lịch cũ trong thời gian chuyển sang Supabase.
  workflow_dispatch:
    inputs:
      use_snapshot:
        description: Dùng bản dữ liệu đã đối chiếu đi kèm mã nguồn
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name != 'schedule' || vars.SUPABASE_MANAGES_CRAWL != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Crawl và dựng website
        if: github.event_name != 'push' && inputs.use_snapshot != true
        run: python scripts/build.py
      - name: Dựng website từ bản dữ liệu đi kèm
        if: github.event_name == 'push' || inputs.use_snapshot == true
        run: python scripts/build.py --snapshot
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Xuất bản lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
